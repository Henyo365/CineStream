[package]
name = "cinestream-engine"
version = "2.2.1"
edition = "2021"
description = "High-performance Rust scraping, search, video resolver and HLS proxy engine for CineStream"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "compression-gzip"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "gzip", "brotli", "deflate", "stream", "http2"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
url = "2"
base64 = "0.22"
sha1 = "0.10"
hex = "0.4"
bytes = "1"
futures-util = "0.3"
moka = { version = "0.12", features = ["future"] }
chrono = "0.4"
strsim = "0.11"
percent-encoding = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
